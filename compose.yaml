name: dcar
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.4-bookworm}
    environment:
      POSTGRES_DB: dcar
      POSTGRES_USER: dcar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap.ps1 or bootstrap.sh}
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcar -d dcar"]
      interval: 3s
      retries: 20
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data
    environment:
      MINIO_ROOT_USER: dcarstorage
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?bootstrap required}
    volumes: ["objects:/data"]
    networks: [backend]
  api:
    build: {context: ., target: services}
    image: dcar-services:0.1.0
    command: ["server"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dcar:${POSTGRES_PASSWORD}@postgres:5432/dcar?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: dcarstorage
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKER_TOKEN_FILE: /run/secrets/worker-token
      API_TOKENS_FILE: /run/secrets/api-tokens.json
      REPO_CREDENTIALS_FILE: /run/secrets/repositories.json
    volumes: ["./config:/app/config:ro", "./secrets/api-tokens.json:/run/secrets/api-tokens.json:ro", "./secrets/repositories.json:/run/secrets/repositories.json:ro", "./secrets/worker-token:/run/secrets/worker-token:ro"]
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    networks: [backend, frontend]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  gateway:
    image: dcar-services:0.1.0
    command: ["gateway"]
    container_name: dcar-gateway
    restart: unless-stopped
    environment:
      CONTROL_URL: http://api:8080
      WORKER_TOKEN_FILE: /run/secrets/worker-token
      MODEL_API_KEY_FILE: /run/secrets/model-key
    volumes: ["./secrets/worker-token:/run/secrets/worker-token:ro", "./secrets/model-key:/run/secrets/model-key:ro"]
    networks: [backend, outbound]
    depends_on: [api]
  worker:
    image: dcar-services:0.1.0
    command: ["worker"]
    user: "0:0"
    restart: unless-stopped
    environment:
      CONTROL_URL: http://api:8080
      WORKER_ID: local-engine
      WORKER_CAPACITY: 2
      WORKER_PROFILES: default,fixture
      WORKER_TOKEN_FILE: /run/secrets/worker-token
      GATEWAY_CONTAINER: dcar-gateway
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "./secrets/worker-token:/run/secrets/worker-token:ro"]
    networks: [backend]
    depends_on: [gateway]
  workspace-image:
    build: {context: ., target: workspace}
    image: dcar-workspace:0.1.0
    profiles: [build]
networks:
  backend: {internal: true}
  frontend: {}
  outbound: {}
volumes:
  postgres: {}
  objects: {}
